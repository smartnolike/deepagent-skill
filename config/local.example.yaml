agent_env: local
agent:
  provider: openai_compatible
  model: deepseek-v4-flash
  # DeepSeek 使用 OpenAI-compatible API；在运行环境中设置 DEEPSEEK_API_KEY。
  base_url: https://api.deepseek.com
  api_key: ${DEEPSEEK_API_KEY}
  #
  # ===== 公司内部模型切换模板（保持注释，按块替换上面的 provider/model/base_url/api_key）=====
  # provider: internal
  # model: openai:internal-model-name
  # base_url: ${MODEL_BASE_URL}
  # 不配置 api_key；内部网关通过 translator 获取短期 Token。
  # token_auth:
  #   translator_url: ${TRANSLATOR_URL}
  #   service_account_name: ${SERVICE_ACCOUNT_NAME}
  #   service_account_password: ${SERVICE_ACCOUNT_PASSWORD}
  #   token_ttl_seconds: 30
  #   refresh_before_expiry_seconds: 5
  #   request_timeout_seconds: 3
  skills_dir: skill-packages
  enabled_skills: [danaan-cloud-resource]
database:
  host: localhost
  port: 5432
  name: deepagent
  user: postgres
  password: postgres
api_auth_token: change-me
log_level: INFO
log_format: text
log_include_stacktrace: true
langfuse:
  enabled: ${LANGFUSE_ENABLED:-false}
  public_key: ${LANGFUSE_PUBLIC_KEY:-}
  secret_key: ${LANGFUSE_SECRET_KEY:-}
  base_url: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
  release: ${RELEASE_VERSION:-}
tools:
  # 设置 external_status_url 后会启用示例 HTTP Tool；root.cer 必须是有效 CA 证书。
  external_status_url: null
  root_ca_path: build/root.cer
mcp_servers:
  danaan:
    enabled: true
    transport: http
    url: ${DANAAN_MCP_URL}
    headers:
      Authorization: Bearer ${DANAAN_MCP_TOKEN}
    timeout_seconds: 15
    reconnect_initial_delay_seconds: 1
    reconnect_max_delay_seconds: 30
    tools: [external_resource_add]
    confirmation_required_tools: [external_resource_add]
