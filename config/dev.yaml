agent_env: dev
agent:
  provider: internal
  model: openai:gpt-5.5
  base_url: ${MODEL_BASE_URL}
  token_auth:
    translator_url: ${TRANSLATOR_URL}
    service_account_name: ${SERVICE_ACCOUNT_NAME}
    service_account_password_secret: ${MODEL_SERVICE_ACCOUNT_PASSWORD_SECRET_VERSION}
    token_ttl_seconds: 30
    refresh_before_expiry_seconds: 5
    request_timeout_seconds: 3
  skills_dir: skill-packages
  enabled_skills: [danaan-cloud-resource]
sandbox:
  provider: gke_backend
  execute_requires_confirmation: ${SANDBOX_EXECUTE_REQUIRES_CONFIRMATION:-true}
  gke:
    namespace: ${SANDBOX_NAMESPACE:-danaan-gcp-portal}
    sandbox_claim_name: ${SANDBOX_CLAIM_NAME:-deepagent-assistant-dev}
    connection_mode: direct
    router_url: ${SANDBOX_ROUTER_URL:-http://danaan-agent-sandbox-router-svc.danaan-gcp-portal.svc.cluster.local:38088}
    runtime_port: 38087
    router_auth_token: ${SANDBOX_ROUTER_AUTH_TOKEN:-}
    workspace_root: /workspace/staff-workspaces
    workspace_retention_seconds: 172800
database:
  host: 127.0.0.1
  port: 5432
  name: deepagent
  user: IAM_DATABASE_USER
api_auth_token: ${API_AUTH_TOKEN}
log_level: INFO
log_format: json
log_include_stacktrace: true
langfuse:
  enabled: ${LANGFUSE_ENABLED:-false}
  public_key_secret: ${LANGFUSE_PUBLIC_KEY_SECRET:-}
  secret_key_secret: ${LANGFUSE_SECRET_KEY_SECRET:-}
  base_url: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
  release: ${RELEASE_VERSION:-}
tools:
  # 例如：https://<host>/api/terraform/schemas；Tool 会追加 /{resourceVersion}，如 /cloudsql522。
  danaan_json_schema_url: null
  root_ca_path: build/root.cer
mcp_servers:
  danaan:
    enabled: true
    transport: http
    url: ${DANAAN_MCP_URL}
    # 自签/企业内部 CA；部署时可通过 MCP_ROOT_CA_PATH 覆盖。
    root_ca_path: ${MCP_ROOT_CA_PATH:-build/root.cer}
    headers:
      Authorization: Bearer ${DANAAN_MCP_TOKEN}
    timeout_seconds: 15
    reconnect_initial_delay_seconds: 1
    reconnect_max_delay_seconds: 30
    tools: [external_resource_add]
    confirmation_required_tools: [external_resource_add]
    context_argument_bindings:
      external_resource_add:
        body.creator: staff_id
    fixed_arguments:
      external_resource_add:
        body.creatorName: ""
        body.creatorEmail: ""
