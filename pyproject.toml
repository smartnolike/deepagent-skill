[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent-platform"
version = "0.1.0"
description = "DeepAgent Platform MVP"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "deepagents>=0.1,<1",
  "fastapi>=0.115,<1",
  "google-cloud-secret-manager>=2.20,<3",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "langgraph-checkpoint-postgres>=2,<4",
  "langchain-openai>=1.1,<2",
  "langfuse>=3,<4",
  "mcp>=1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "langchain-kubernetes[agent-sandbox]>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
